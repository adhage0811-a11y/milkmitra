```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Milk Delivery Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🥛 Milk Delivery Management System</h1>
        <p>Fresh Milk • Easy Subscription • Affordable Delivery</p>
    </header>

    <main class="login-container">

        <h2>Login</h2>
        <p>Select your account type</p>

        <div class="role-container">

            <button onclick="showLogin('farmer')">
                👨‍🌾 Farmer Login
            </button>

            <button onclick="showLogin('customer')">
                👤 Customer Login
            </button>

            <button onclick="showLogin('admin')">
                🏪 Dairy / Admin Login
            </button>

        </div>

        <div id="loginBox" class="login-box">

            <h3 id="loginTitle">Select Login Type</h3>

            <input
                type="text"
                id="mobile"
                placeholder="Enter Mobile Number"
                maxlength="10"
            >

            <button onclick="sendOTP()">Send OTP</button>

            <div id="otpBox" style="display:none;">

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter OTP"
                    maxlength="6"
                >

                <button onclick="verifyOTP()">Verify OTP</button>

            </div>

            <p id="message"></p>

        </div>

    </main>

    <footer>
        <p>© 2026 Milk Delivery Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
